<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple quote generator</title>
    <!-- body uchun minimal style -->
    <style>
      body {
        font-family: sans-serif;
        display: grid;
      }
    </style>
  </head>
  <body>
    <!-- iqtibos matni ushun bitta div -->
    <div class="quote-container">
      <p class="quote-text">"Iqtibos matni bu yerda bo'ladi."</p>
      <p class="quote-author">- Muallif Ismi</p>
    </div>
    <!-- tugma yangi iqtibosni generatsiya qilish uchun -->
    <button class="btn">Yangi Iqtibos</button>

    <!--main.js fayli-->
    <script src="main.js"></script>
  </body>
</html>
